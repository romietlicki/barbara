app = "barbara-api"
primary_region = "gru"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  NODE_ENV  = "production"
  PORT      = "3001"
  API_HOST  = "0.0.0.0"
  LOG_LEVEL = "info"

[http_service]
  internal_port        = 3001
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 100
    soft_limit = 80

[checks]
  [checks.health]
    grace_period = "10s"
    interval     = "30s"
    method       = "GET"
    path         = "/health"
    port         = 3001
    timeout      = "5s"
    type         = "http"

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "1gb"
